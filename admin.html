<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Jordoncup Admin</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #111;
  color: white;
}

header {
  padding: 16px;
  text-align: center;
  background: #1c1c1c;
  font-size: 1.2rem;
  font-weight: bold;
}

.container { padding: 16px; }

label {
  font-size: 0.85rem;
  opacity: 0.8;
  display: block;
  margin-top: 10px;
}

select, input[type="number"] {
  width: 100%;
  padding: 10px;
  margin-top: 4px;
  margin-bottom: 14px;
  border-radius: 8px;
  border: none;
  font-size: 1rem;
}

input[type="checkbox"] {
  transform: scale(1.3);
  margin-right: 8px;
}

.card-wrapper { overflow: hidden; }

.card-track {
  display: flex;
  transition: transform 0.3s ease;
  touch-action: pan-y;
}

.player-card {
  min-width: 100%;
  box-sizing: border-box;
  padding: 20px;
  background: #1c1c1c;
  border-radius: 14px;
}

.rule-section {
  border-top: 1px solid #333;
  padding-top: 10px;
  margin-top: 10px;
}

.nav-buttons {
  display: flex;
  justify-content: space-between;
  margin-top: 10px;
}

button {
  background: gold;
  border: none;
  padding: 14px;
  border-radius: 10px;
  font-weight: bold;
  font-size: 1rem;
  width: 100%;
  margin-top: 10px;
  cursor: pointer;
}

button:disabled { background: #555; }

.submit-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  background: #000;
  padding: 12px;
}

.top-buttons {
  display: flex;
  justify-content: space-between;
  margin-bottom: 12px;
}

.week-select { margin-bottom: 20px; }
</style>
</head>

<body>

<script type="module">
if (localStorage.getItem("isAdmin") !== "true") {
  alert("Access denied. Please login as admin.");
  window.location.href = "login.html";
}
</script>

<header>Jordoncup Admin</header>

<div class="container">

  <div class="top-buttons">
    <button onclick="window.location.href='leaderboard.html'">Leaderboard</button>
    <button onclick="window.location.href='weekscores.html'">Week Scores</button>
  </div>

  <label>Select Week</label>
  <select id="week" class="week-select"></select>

  <div class="card-wrapper">
    <div class="card-track" id="card-track"></div>
  </div>

  <div class="nav-buttons">
    <button type="button" id="prevBtn">←</button>
    <button type="button" id="nextBtn">→</button>
  </div>

</div>

<div class="submit-bar">
  <button type="button" id="submitWeekBtn">SUBMIT WEEK</button>
</div>

<script type="module">
import { db } from './firebaseConfig.js';
import { doc, setDoc, getDoc } from 'https://www.gstatic.com/firebasejs/10.3.0/firebase-firestore.js';

document.addEventListener("DOMContentLoaded", () => {

  const players = ["Micheal","Tom","Luke","Jeff","Jordan","Travis"];
  const weekSelect = document.getElementById("week");
  const track = document.getElementById("card-track");

  // Generate weeks
  let startDate = new Date("2026-04-03");
  let endDate = new Date("2026-06-25");

  while (startDate <= endDate) {
    const option = document.createElement("option");
    option.value = startDate.toISOString().split("T")[0];
    option.textContent = `Week - ${startDate.toLocaleDateString("en-AU")}`;
    weekSelect.appendChild(option);
    startDate.setDate(startDate.getDate() + 7);
  }

  // Home game
  const homeOption = document.createElement("option");
  homeOption.value = "HOME-GAME-2026";
  homeOption.textContent = "🏠 Home Game";
  weekSelect.appendChild(homeOption);

  // Create player cards
  players.forEach(player => {
    const card = document.createElement("div");
    card.className = "player-card";
    card.innerHTML = `
      <h2>${player}</h2>

      <label>Wild Scalps (+5)</label>
      <input type="number" class="wildScalps" min="0" value="0">

      <label>Head Hunter (+10)</label>
      <input type="number" class="headHunter" min="0" value="0">

      <label>Golden Snitch (+10)</label>
      <input type="number" class="goldenSnitch" min="0" value="0">

      <label>Snitch Bounty (+5)</label>
      <input type="number" class="snitchHolderBounty" min="0" value="0">

      <div class="rule-section">
        <label>Final Table Position</label>
        <select class="final-position">
          <option value="">--</option>
          <option value="1">1st (+50)</option>
          <option value="2">2nd (+40)</option>
          <option value="3">3rd (+30)</option>
          <option value="4">4th (+20)</option>
          <option value="5">5th (+10)</option>
        </select>
      </div>

      <div class="rule-section">
        <label><input type="checkbox" class="savedByBreak"> Saved By The Bell (+10)</label>
        <label><input type="checkbox" class="rebuy"> Rebuy Bust (-10)</label>
      </div>

      <div class="rule-section">
        <label>Eliminated (-10)</label>
        <input type="number" class="eliminated" min="0" value="0">

        <label>Snitch Elim (-25)</label>
        <input type="number" class="snitchElim" min="0" value="0">

        <label>Fish 7-2 Bounty (+72)</label>
        <input type="number" class="fishBounty72" min="0" value="0">

        <label>Fish 7-2 KO (+36)</label>
        <input type="number" class="fishKO72" min="0" value="0">

        <label>Death by Quads (+40)</label>
        <input type="number" class="deathByQuads" min="0" value="0">
      </div>
    `;
    track.appendChild(card);
  });

  // Slide navigation
  let currentIndex = 0;
  const updateSlide = () => {
    track.style.transform = `translateX(-${currentIndex * 100}%)`;
  };

  document.getElementById("prevBtn").onclick = () => {
    if (currentIndex > 0) { currentIndex--; updateSlide(); }
  };

  document.getElementById("nextBtn").onclick = () => {
    if (currentIndex < players.length - 1) { currentIndex++; updateSlide(); }
  };
    // ✅ SWIPE SUPPORT (restored exactly like your original)
  let startX = 0;
  let endX = 0;

  track.addEventListener("touchstart", e => {
    startX = e.touches[0].clientX;
  });

  track.addEventListener("touchend", e => {
    endX = e.changedTouches[0].clientX;
    handleSwipe();
  });

  function handleSwipe() {
    const diff = startX - endX;

    if (diff > 50 && currentIndex < players.length - 1) {
      currentIndex++;
    }

    if (diff < -50 && currentIndex > 0) {
      currentIndex--;
    }

    updateSlide();
  }

  // LOAD SCORES WHEN WEEK CHANGES
  async function loadScoresForWeek(week) {

    const cards = document.querySelectorAll(".player-card");

    for (let i = 0; i < players.length; i++) {

      const player = players[i];
      const card = cards[i];
      const docId = `${week}-${player}`.replace(/\s+/g,'_');

      const docRef = doc(db, 'scores', docId);
      const docSnap = await getDoc(docRef);

      if (docSnap.exists()) {
        const data = docSnap.data();

        card.querySelector(".wildScalps").value = data.wildScalps ?? 0;
        card.querySelector(".headHunter").value = data.headHunter ?? 0;
        card.querySelector(".goldenSnitch").value = data.goldenSnitch ?? 0;
        card.querySelector(".snitchHolderBounty").value = data.snitchHolderBounty ?? 0;
        card.querySelector(".final-position").value = data.finalPosition ?? "";
        card.querySelector(".savedByBreak").checked = data.savedByBreak ?? false;
        card.querySelector(".rebuy").checked = data.rebuy ?? false;
        card.querySelector(".eliminated").value = data.eliminated ?? 0;
        card.querySelector(".snitchElim").value = data.snitchElim ?? 0;
        card.querySelector(".fishBounty72").value = data.fishBounty72 ?? 0;
        card.querySelector(".fishKO72").value = data.fishKO72 ?? 0;
        card.querySelector(".deathByQuads").value = data.deathByQuads ?? 0;

      } else {
        card.querySelectorAll("input[type='number']").forEach(i => i.value = 0);
        card.querySelectorAll("input[type='checkbox']").forEach(i => i.checked = false);
        card.querySelector(".final-position").value = "";
      }
    }
  }

  weekSelect.addEventListener("change", (e) => {
    loadScoresForWeek(e.target.value);
  });

  if (weekSelect.value) {
    loadScoresForWeek(weekSelect.value);
  }

  // Submit week
  document.getElementById("submitWeekBtn").addEventListener("click", async () => {

    const week = weekSelect.value;
    if (!week) { alert("Select a week!"); return; }

    const cards = document.querySelectorAll(".player-card");

    for (let i = 0; i < cards.length; i++) {

      const card = cards[i];
      const player = players[i];

      const data = {
        player,
        week,
        wildScalps: Number(card.querySelector(".wildScalps").value),
        headHunter: Number(card.querySelector(".headHunter").value),
        goldenSnitch: Number(card.querySelector(".goldenSnitch").value),
        snitchHolderBounty: Number(card.querySelector(".snitchHolderBounty").value),
        finalPosition: card.querySelector(".final-position").value ? Number(card.querySelector(".final-position").value) : null,
        savedByBreak: card.querySelector(".savedByBreak").checked,
        rebuy: card.querySelector(".rebuy").checked,
        eliminated: Number(card.querySelector(".eliminated").value),
        snitchElim: Number(card.querySelector(".snitchElim").value),
        fishBounty72: Number(card.querySelector(".fishBounty72").value),
        fishKO72: Number(card.querySelector(".fishKO72").value),
        deathByQuads: Number(card.querySelector(".deathByQuads").value)
      };

      const docId = `${week}-${player}`.replace(/\s+/g,'_');
      await setDoc(doc(db,'scores',docId), data);
    }

    alert("Week submitted successfully!");
  });

});
</script>

</body>
</html>
