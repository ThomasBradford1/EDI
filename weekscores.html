<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Previous Week Scores</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 15px;
    background: #f0f0f0;
    color: #333;
  }

  h1 {
    text-align: center;
    margin-bottom: 20px;
    font-size: 1.8rem;
  }

  label, select {
    display: block;
    margin: 10px 0;
    font-weight: 600;
  }

  select {
    padding: 6px 10px;
    border-radius: 5px;
    border: 1px solid #ccc;
  }

  .table-container {
    width: 100%;
    overflow-x: auto;
    margin-top: 15px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    min-width: 500px;
    background: #fff;
    border-radius: 8px;
    overflow: hidden;
  }

  th, td {
    padding: 8px 12px;
    border-bottom: 1px solid #ccc;
    text-align: center;
  }

  th {
    background-color: #4caf50;
    color: white;
    font-weight: 600;
    position: sticky;
    top: 0;
    z-index: 1;
  }

  td:first-child, th:first-child {
    text-align: left;
    font-weight: 700;
    color: #2e7d32;
  }

  /* Mobile-first: stacked table */
  @media (max-width: 700px) {
    table, thead, tbody, th, td, tr {
      display: block;
    }

    thead {
      display: none;
    }

    tr.main-row {
      background: #fff;
      margin-bottom: 10px;
      border-radius: 8px;
      padding: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.12);
    }

    tr.details-row {
      display: none;
      background: #eef5ee;
      margin-bottom: 10px;
      border-radius: 8px;
      padding: 10px;
    }

    td {
      border: none;
      padding: 6px 0;
      text-align: left;
      position: relative;
    }

    td[data-label]::before {
      content: attr(data-label) ": ";
      font-weight: 600;
      color: #555;
    }

    .view-details-btn {
      display: block;
      margin-top: 8px;
      padding: 5px 8px;
      font-size: 0.9rem;
      background: #4caf50;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
  }

  a, button {
    display: inline-block;
    margin-top: 20px;
    padding: 10px 15px;
    border-radius: 5px;
    font-weight: bold;
    text-decoration: none;
  }

  a {
    background-color: #4caf50;
    color: white;
  }

  button#logout-btn {
    background-color: #e53935;
    color: white;
    border: none;
    cursor: pointer;
  }
</style>
</head>
<body>
<h1>Previous Week Scores</h1>

<label for="weekSelect">Select Week:</label>
<select id="weekSelect">
  <option value="">-- Choose a week --</option>
</select>

<div class="table-container">
  <table id="week-table">
    <thead>
      <tr>
        <th>Player</th>
        <th>Total Points</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="week-body">
      <tr><td colspan="3">Select a week to view scores.</td></tr>
    </tbody>
  </table>
</div>

<a href="leaderboard.html">← Back to Leaderboard</a>
<button id="logout-btn">Logout</button>

<script type="module">
import { db } from './firebaseConfig.js';
import { collection, getDocs, query, where } from 'https://www.gstatic.com/firebasejs/10.3.0/firebase-firestore.js';

const weekSelect = document.getElementById("weekSelect");
const weekBody = document.getElementById("week-body");

// Load all weeks
async function loadWeeks() {
  const snapshot = await getDocs(collection(db, "scores"));
  const weeks = new Set();
  snapshot.forEach(doc => {
    const data = doc.data();
    if (data.week) weeks.add(data.week);
  });
  Array.from(weeks).sort().forEach(week => {
    const option = document.createElement("option");
    option.value = week;
    option.textContent = week;
    weekSelect.appendChild(option);
  });
}

// Calculate total points per player for the week
function calculateTotalPoints(data) {
  let total = 0;
  total += (data.wildScalps || 0) * 5;
  total += (data.headHunter || 0) * 10;
  total += (data.eliminated || 0) * -10;
  total += data.goldenSnitch ? 10 : 0;
  total += data.snitchElim ? -25 : 0;
  total += data.snitchHolderBounty ? 5 : 0;
  total += data.finalPosition ? [50,40,30,20,10][data.finalPosition-1] || 0 : 0;
  total += data.rebuy ? -10 : 0;
  total += data.savedByBreak ? 10 : 0;
  total += (data.fishBounty72 || 0) * 72;
  total += (data.fishKO72 || 0) * 36;
  total += (data.deathByQuads || 0) * 40;
  return total;
}

weekSelect.addEventListener("change", async (e) => {
  const selectedWeek = e.target.value;
  if (!selectedWeek) return;

  const q = query(collection(db, "scores"), where("week", "==", selectedWeek));
  const snapshot = await getDocs(q);

  if (snapshot.empty) {
    weekBody.innerHTML = "<tr><td colspan='3'>No scores found.</td></tr>";
    return;
  }

  const players = [];
  snapshot.forEach(doc => {
    const data = doc.data();

    // Compute raw counts
    const counts = {
      wildScalps: data.wildScalps || 0,
      headHunter: data.headHunter || 0,
      eliminated: data.eliminated || 0,
      goldenSnitch: data.goldenSnitch ? 1 : 0,
      snitchElim: data.snitchElim ? 1 : 0,
      snitchHolderBounty: data.snitchHolderBounty ? 1 : 0,
      finalPosition: data.finalPosition || 0,
      rebuy: data.rebuy ? 1 : 0,
      savedByBreak: data.savedByBreak ? 1 : 0,
      fishBounty72: data.fishBounty72 || 0,
      fishKO72: data.fishKO72 || 0,
      deathByQuads: data.deathByQuads || 0
    };

    players.push({ player: data.player, totalPoints: calculateTotalPoints(data), counts });
  });

  // Sort descending
  players.sort((a,b) => b.totalPoints - a.totalPoints);

  weekBody.innerHTML = "";

  players.forEach(p => {
    const mainRow = document.createElement("tr");
    mainRow.classList.add("main-row");
    mainRow.innerHTML = `
      <td>${p.player}</td>
      <td>${p.totalPoints}</td>
      <td><button class="view-details-btn">View Details</button></td>
    `;
    weekBody.appendChild(mainRow);

    const detailsRow = document.createElement("tr");
    detailsRow.classList.add("details-row");
    detailsRow.innerHTML = `
      <td colspan="3">
        <strong>Wild Scalps:</strong> ${p.counts.wildScalps} &nbsp;
        <strong>Head Hunter:</strong> ${p.counts.headHunter} &nbsp;
        <strong>Eliminated:</strong> ${p.counts.eliminated} &nbsp;
        <strong>Golden Snitch:</strong> ${p.counts.goldenSnitch} &nbsp;
        <strong>Snitch Elim:</strong> ${p.counts.snitchElim} &nbsp;
        <strong>Snitch Holder Bounty:</strong> ${p.counts.snitchHolderBounty} &nbsp;
        <strong>Final Position:</strong> ${p.counts.finalPosition} &nbsp;
        <strong>Rebuy Bust:</strong> ${p.counts.rebuy} &nbsp;
        <strong>Saved By Break:</strong> ${p.counts.savedByBreak} &nbsp;
        <strong>Fish 7-2 Bounty:</strong> ${p.counts.fishBounty72} &nbsp;
        <strong>Fish 7-2 KO:</strong> ${p.counts.fishKO72} &nbsp;
        <strong>Death by Quads:</strong> ${p.counts.deathByQuads}
      </td>
    `;
    weekBody.appendChild(detailsRow);

    mainRow.querySelector(".view-details-btn").addEventListener("click", () => {
      detailsRow.style.display = detailsRow.style.display === "table-row" ? "none" : "table-row";
    });
  });
});

loadWeeks();
</script>

<script type="module">
import { auth } from './firebaseConfig.js';
import { signOut } from 'https://www.gstatic.com/firebasejs/10.3.0/firebase-auth.js';

document.getElementById('logout-btn').addEventListener('click', async () => {
  await signOut(auth);
  localStorage.removeItem("isAdmin");
  window.location.href = 'index.html';
});
</script>
</body>
</html>
