<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Fantasy Leaderboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background-image: url("lol.png");
        background-size: cover;
        background-repeat: no-repeat;
        background-position: right bottom;
        background-attachment: fixed;
      }

      @media (max-width: 600px) {
        body {
          background-size: 170%;
          background-position: calc(100% - 30px) calc(100% - 300px);
        }
      }

      .overlay {
        background-color: rgba(255, 255, 255, 0.85);
        padding: 20px;
        max-width: 1200px;
        margin: auto;
        border-radius: 10px;
      }

      h1 {
        font-size: 1.5rem;
        text-align: center;
        margin-bottom: 20px;
      }

      .table-wrapper {
        overflow-x: auto;
        width: 100%;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 650px;
      }

      thead tr {
        background-color: #4caf50;
        color: white;
        font-weight: 600;
        position: sticky;
        top: 0;
        z-index: 1;
      }

      th,
      td {
        padding: 8px 10px;
        border-bottom: 1px solid #c6e0b4;
        text-align: center;
        white-space: nowrap;
      }

      th:nth-child(1),
      td:nth-child(1),
      th:nth-child(2),
      td:nth-child(2),
      th:nth-child(3),
      td:nth-child(3) {
        font-weight: 700;
        color: #2e7d32;
      }

      th:nth-child(n + 4),
      td:nth-child(n + 4) {
        font-size: 0.85rem;
        color: #555;
      }

      a.button {
        display: inline-block;
        margin: 10px 5px;
        padding: 10px 15px;
        background-color: #4caf50;
        color: white;
        text-decoration: none;
        border-radius: 5px;
        font-size: 1rem;
      }

      a#adminButton {
        background-color: #444;
      }

      #logout-btn {
        margin-top: 20px;
        padding: 8px 15px;
        background-color: #e53935;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
    </style>
<head>
<meta charset="UTF-8">
<title>Leaderboard - Jordoncup</title>
<style>
  body { font-family: Arial; background:#f0f0f0; padding:20px; }
  table { border-collapse: collapse; width: 100%; background:white; border-radius:10px; overflow:hidden; }
  th, td { padding:8px 12px; border:1px solid #ccc; text-align:center; }
  th { background:#4caf50; color:white; }
  h2 { text-align:center; }
</style>
</head>
<body>
<h2>Jordoncup Leaderboard</h2>
<table id="leaderboard-table">
  <thead>
    <tr>
      <th>Player</th>
      <th>Wild Scalps</th>
      <th>Head Hunter</th>
      <th>Eliminated</th>
      <th>Golden Snitch</th>
      <th>Snitch Elimination</th>
      <th>Snitch Holder Bounty</th>
      <th>Final Position</th>
      <th>Rebuy</th>
      <th>Saved By Break</th>
      <th>Fish 7-2 Bounty</th>
      <th>Fish 7-2 KO</th>
      <th>Death by Quads</th>
      <th>Total Points</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<script type="module">
import { db } from './firebaseConfig.js';
import { collection, getDocs } from 'https://www.gstatic.com/firebasejs/10.3.0/firebase-firestore.js';

const tableBody = document.querySelector('#leaderboard-table tbody');
const players = ["Micheal","Tom","Luke","Jeff","Jordan"];
const finalPoints = [50,40,30,20,10];

async function loadLeaderboard() {
  const scoresSnap = await getDocs(collection(db, 'scores'));
  const scores = {};
  scoresSnap.forEach(doc => {
    const data = doc.data();
    if(!scores[data.player]) scores[data.player]=[];
    scores[data.player].push(data);
  });

  const leaderboard = players.map(player=>{
    const playerScores = scores[player]||[];
    const totals = {
      wildScalps:0, headHunter:0, eliminated:0,
      goldenSnitch:0, snitchElim:0, snitchHolderBounty:0,
      finalPosition:0, rebuy:0, savedByBreak:0,
      fishBounty72:0, fishKO72:0, deathByQuads:0,
      totalPoints:0
    };
    playerScores.forEach(s=>{
      totals.wildScalps += s.wildScalps*5;
      totals.headHunter += s.headHunter*10;
      totals.eliminated += s.eliminated*-10;
      totals.goldenSnitch += s.goldenSnitch*10;
      totals.snitchElim += s.snitchElim*-25;
      totals.snitchHolderBounty += s.snitchHolderBounty*5;
      if(s.finalPosition) totals.finalPosition += finalPoints[s.finalPosition-1];
      totals.rebuy += s.rebuy?0:0;
      totals.savedByBreak += s.savedByBreak?10:0;
      totals.fishBounty72 += s.fishBounty72*72;
      totals.fishKO72 += s.fishKO72*36;
      totals.deathByQuads += s.deathByQuads*40;
      totals.totalPoints = totals.wildScalps+totals.headHunter+totals.eliminated+totals.goldenSnitch+totals.snitchElim+totals.snitchHolderBounty+totals.finalPosition+totals.savedByBreak+totals.fishBounty72+totals.fishKO72+totals.deathByQuads;
    });
    return { player, ...totals };
  });

  tableBody.innerHTML = leaderboard.map(l=>`
    <tr>
      <td>${l.player}</td>
      <td>${l.wildScalps}</td>
      <td>${l.headHunter}</td>
      <td>${l.eliminated}</td>
      <td>${l.goldenSnitch}</td>
      <td>${l.snitchElim}</td>
      <td>${l.snitchHolderBounty}</td>
      <td>${l.finalPosition}</td>
      <td>${l.rebuy}</td>
      <td>${l.savedByBreak}</td>
      <td>${l.fishBounty72}</td>
      <td>${l.fishKO72}</td>
      <td>${l.deathByQuads}</td>
      <td>${l.totalPoints}</td>
    </tr>
  `).join('');
}

loadLeaderboard();
</script>
</body>
</html>
