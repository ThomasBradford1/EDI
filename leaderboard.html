<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jordoncup Leaderboard</title>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0 10px;
    background: #f0f0f0;
    min-height: 100vh;
  }

  h1 {
    text-align: center;
    margin: 20px 0;
  }

  /* Top buttons */
  #buttons-container {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-bottom: 10px;
  }

  button {
    padding: 8px 12px;
    background: #4caf50;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
  }

  button:hover {
    background: #388e3c;
  }

  .table-wrapper {
    overflow-x: auto;
    margin-bottom: 40px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    min-width: 400px;
    background: white;
    border-radius: 10px;
    overflow: hidden;
  }

  thead tr {
    background-color: #4caf50;
    color: white;
    font-weight: 600;
    position: sticky;
    top: 0;
    z-index: 1;
  }

  th, td {
    padding: 8px 10px;
    text-align: center;
    border-bottom: 1px solid #c6e0b4;
    white-space: nowrap;
  }

  th:first-child, td:first-child {
    text-align: left;
    font-weight: 700;
    color: #2e7d32;
  }

  .details {
    display: none;
  }

  .details td {
    font-size: 0.85rem;
    color: #555;
    text-align: left;
  }

  .toggle-btn {
    cursor: pointer;
    color: #2196F3;
    text-decoration: underline;
  }

  @media (max-width: 600px) {
    table { min-width: 350px; }
  }
</style>
</head>

<body>
<h1>Jordoncup Leaderboard</h1>

<div id="buttons-container">
  <button id="week-scores-btn" onclick="window.location.href='weekscores.html'">Week Scores</button>
  <button id="login-btn" onclick="window.location.href='login.html'">Admin Login</button>
</div>

<div class="table-wrapper">
  <table id="leaderboard-table">
    <thead>
      <tr>
        <th>Player</th>
        <th>Total Points</th>
        <th>Details</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<script type="module">
import { db } from './firebaseConfig.js';
import { collection, getDocs } from 'https://www.gstatic.com/firebasejs/10.3.0/firebase-firestore.js';

const tableBody = document.querySelector('#leaderboard-table tbody');
const players = ["Micheal","Tom","Luke","Jeff","Jordan","Travis"];
const finalPoints = [50,40,30,20,10]; // For 1st-5th

async function loadLeaderboard() {
  const scoresSnap = await getDocs(collection(db, 'scores'));
  const scores = {};
  scoresSnap.forEach(doc => {
    const data = doc.data();
    if(!scores[data.player]) scores[data.player]=[];
    scores[data.player].push(data);
  });

  const leaderboard = players.map(player=>{
    const playerScores = scores[player] || [];
    const totals = {
      wildScalps:0, headHunter:0, eliminated:0,
      goldenSnitch:0, snitchElim:0, snitchHolderBounty:0,
      finalPosition:0, rebuy:0, savedByBreak:0,
      fishBounty72:0, fishKO72:0, deathByQuads:0,
      totalPoints:0
    };

    playerScores.forEach(s=>{
      totals.wildScalps += s.wildScalps*5;
      totals.headHunter += s.headHunter*10;
      totals.eliminated += s.eliminated*-10;
      totals.goldenSnitch += s.goldenSnitch*10;
      totals.snitchElim += s.snitchElim*-25;
      totals.snitchHolderBounty += s.snitchHolderBounty*5;
      if(s.finalPosition) totals.finalPosition += finalPoints[s.finalPosition-1];
      totals.rebuy += s.rebuy ? -10 : 0;
      totals.savedByBreak += s.savedByBreak ? 10 : 0;
      totals.fishBounty72 += s.fishBounty72*72;
      totals.fishKO72 += s.fishKO72*36;
      totals.deathByQuads += s.deathByQuads*40;
    });

    totals.totalPoints = totals.wildScalps + totals.headHunter + totals.eliminated +
                         totals.goldenSnitch + totals.snitchElim + totals.snitchHolderBounty +
                         totals.finalPosition + totals.rebuy + totals.savedByBreak +
                         totals.fishBounty72 + totals.fishKO72 + totals.deathByQuads;

    return { player, finalPosition: totals.finalPosition, totalPoints: totals.totalPoints,
             wildScalps: totals.wildScalps, headHunter: totals.headHunter, eliminated: totals.eliminated,
             goldenSnitch: totals.goldenSnitch, snitchElim: totals.snitchElim,
             snitchHolderBounty: totals.snitchHolderBounty, rebuy: totals.rebuy,
             savedByBreak: totals.savedByBreak, fishBounty72: totals.fishBounty72,
             fishKO72: totals.fishKO72, deathByQuads: totals.deathByQuads };
  });

  leaderboard.sort((a,b)=>b.totalPoints - a.totalPoints);

  tableBody.innerHTML = '';

  leaderboard.forEach(l=>{
    const row = document.createElement('tr');
    row.innerHTML = `
      <td>${l.player}</td>
      <td>${l.totalPoints}</td>
      <td><span class="toggle-btn">Show</span></td>
    `;
    tableBody.appendChild(row);

    const detailsRow = document.createElement('tr');
    detailsRow.classList.add('details');
    detailsRow.innerHTML = `
      <td colspan="3">
        Final Table Points: ${l.finalPosition}, Wild Scalps: ${l.wildScalps}, Head Hunter: ${l.headHunter}, Eliminated: ${l.eliminated}, 
        Golden Snitch: ${l.goldenSnitch}, Snitch Elim: ${l.snitchElim}, Snitch Holder Bounty: ${l.snitchHolderBounty}, 
        Rebuy Bust: ${l.rebuy}, Saved By Break: ${l.savedByBreak}, Fish 7-2 Bounty: ${l.fishBounty72}, Fish 7-2 KO: ${l.fishKO72}, Death by Quads: ${l.deathByQuads}
      </td>
    `;
    tableBody.appendChild(detailsRow);

    row.querySelector('.toggle-btn').addEventListener('click', ()=>{
      const isVisible = detailsRow.style.display==='table-row';
      detailsRow.style.display = isVisible ? 'none' : 'table-row';
      row.querySelector('.toggle-btn').textContent = isVisible ? 'Show' : 'Hide';
    });
  });
}

loadLeaderboard();
</script>
</body>
</html>
